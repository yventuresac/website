  <style>
    .as-wrap { max-width: 780px; margin: 0 auto; }
    .as-msg { padding: var(--space-xl) var(--space-md); text-align: center; color: var(--text-3);
              border: 1px dashed var(--edge); border-radius: 12px; line-height: var(--lh-relaxed); }
    .as-item { padding: var(--space-md); border: 1px solid var(--edge); border-radius: 14px;
               background: var(--bg-card); margin-bottom: 12px; }
    .as-item .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .as-item h3 { margin: 0; font-size: var(--text-body-lg); color: var(--text-1); letter-spacing: var(--ls-snug); }
    .as-due { font-size: 12px; color: var(--text-3); }
    .as-due.soon { color: #FCD34D; }
    .as-due.past { color: #FCA5A5; }
    .as-item .meta { margin: 4px 0 10px; font-size: 13px; color: var(--text-3); }
    .as-item .meta a { color: #93C5FD; }
    .as-submit { display: flex; gap: 8px; flex-wrap: wrap; }
    .as-submit input {
      flex: 1; min-width: 200px; padding: 10px 14px; font-size: 14px;
      font-family: 'Pretendard', sans-serif; color: var(--text-1);
      background: var(--bg-base); border: 1px solid var(--edge); border-radius: 10px;
    }
    .as-submit input:focus { outline: none; border-color: var(--edge-hover); }
    .as-done { font-size: 13px; color: #6EE7B7; }
    .fmsg { margin: 6px 0 0; font-size: 13px; min-height: 16px; }
    .fmsg.ok { color: #6EE7B7; } .fmsg.err { color: #FCA5A5; }
    .as-subs { margin-top: 10px; font-size: 13px; color: var(--text-2); }
    .as-subs a { color: #93C5FD; }
    .as-form { margin-top: var(--space-2xl); padding: var(--space-lg);
               border: 1px solid var(--edge); border-radius: 16px; background: var(--bg-card); }
    .as-form h2 { margin: 0 0 var(--space-md); font-size: 20px; color: var(--text-1); }
    .as-form label { display: block; margin-bottom: 12px; }
    .as-form label span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-2); }
    .as-form input, .as-form select {
      width: 100%; padding: 11px 14px; font-size: 14px; font-family: 'Pretendard', sans-serif;
      color: var(--text-1); background: var(--bg-base);
      border: 1px solid var(--edge); border-radius: 10px;
    }
    .as-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .as-row { grid-template-columns: 1fr; } }
  </style>

  <div class="page-header">
    <div class="page-tag">Members</div>
    <h1 class="page-title">과제 제출</h1>
    <p class="page-desc">커리큘럼 과제를 링크로 제출합니다. 다시 제출하면 이전 제출을 덮어씁니다.</p>
  </div>

  <section class="section">
    <div class="as-wrap" id="root">
      <div class="as-msg">불러오는 중…</div>
    </div>
  </section>

  <script>
    (function () {
      var root = document.getElementById("root");
      var db = null, me = null, assignments = [], mySubs = {}, allSubs = {};

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function msg(t) { root.innerHTML = '<div class="as-msg">' + t + '</div>'; }
      function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : null; }

      function dueHtml(d) {
        if (!d) return "";
        var due = new Date(d + "T23:59:59");
        var days = Math.ceil((due - new Date()) / 86400000);
        var cls = days < 0 ? "past" : (days <= 3 ? "soon" : "");
        var label = days < 0 ? "마감 지남" : (days === 0 ? "오늘 마감" : "D-" + days);
        return '<span class="as-due ' + cls + '">' + esc(d) + " · " + label + '</span>';
      }

      function itemHtml(a) {
        var sub = mySubs[a.id];
        var subs = allSubs[a.id] || [];
        return '<div class="as-item">' +
          '<div class="top"><h3>' + esc(a.title) +
          (a.generation != null ? ' <span style="font-size:12px;color:var(--text-3);font-weight:400">' + a.generation + '기</span>' : "") +
          '</h3>' + dueHtml(a.due_date) + '</div>' +
          '<p class="meta">' + (safeUrl(a.detail_url) ? '<a href="' + esc(a.detail_url) + '" target="_blank" rel="noopener">과제 안내 보기 ↗</a>' : "") + '</p>' +
          '<div class="as-submit">' +
          '<input type="url" placeholder="제출물 링크 (노션·드라이브·슬라이드 등)" value="' + esc(sub ? sub.url : "") + '" data-url="' + a.id + '" />' +
          '<button type="button" class="btn btn-black" data-submit="' + a.id + '">' + (sub ? "다시 제출" : "제출") + '</button>' +
          '</div>' +
          (sub ? '<p class="as-done">제출됨 · ' + esc(String(sub.submitted_at || "").slice(0, 10)) + '</p>' : "") +
          '<p class="fmsg" data-msg="' + a.id + '"></p>' +
          (me.is_admin && subs.length
            ? '<div class="as-subs">제출 ' + subs.length + '건 — ' +
              subs.map(function (s) {
                return (safeUrl(s.url) ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' : "<span>") +
                       esc(s.author_name || "이름 없음") + (safeUrl(s.url) ? "</a>" : "</span>");
              }).join(", ") + '</div>'
            : "") +
          '</div>';
      }

      function adminFormHtml() {
        var genOpts = '<option value="">전 기수</option>';
        for (var g = 0; g <= 6; g++) genOpts += '<option value="' + g + '">' + g + '기</option>';
        return '<form class="as-form" id="newForm">' +
          '<h2>과제 내기 (운영진)</h2>' +
          '<label><span>제목</span><input name="title" required maxlength="200" placeholder="예: 2주차 — 시장분석 리포트" /></label>' +
          '<label><span>과제 안내 링크 (선택)</span><input name="detail_url" type="url" placeholder="https://... (노션 등)" /></label>' +
          '<div class="as-row">' +
          '<label><span>대상 기수</span><select name="generation">' + genOpts + '</select></label>' +
          '<label><span>마감일 (선택)</span><input name="due_date" type="date" /></label>' +
          '</div>' +
          '<button type="submit" class="btn btn-black">등록</button>' +
          '<p class="fmsg" id="newMsg"></p>' +
          '</form>';
      }

      function render() {
        var list = assignments.length
          ? assignments.map(itemHtml).join("")
          : '<div class="as-msg">등록된 과제가 없습니다.' + (me.is_admin ? " 아래에서 첫 과제를 내보세요." : "") + '</div>';
        root.innerHTML = list + (me.is_admin ? adminFormHtml() : "");

        root.querySelectorAll("[data-submit]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-submit"));
            var input = root.querySelector('[data-url="' + id + '"]');
            var fm = root.querySelector('[data-msg="' + id + '"]');
            var url = input.value.trim();
            if (!safeUrl(url)) { fm.textContent = "http:// 또는 https:// 로 시작하는 주소만 제출할 수 있습니다."; fm.className = "fmsg err"; return; }
            fm.textContent = "제출 중…"; fm.className = "fmsg";
            db.from("assignment_submissions").upsert({
              assignment_id: id, user_id: me.id, author_name: me.display_name || "",
              url: url, submitted_at: new Date().toISOString()
            }, { onConflict: "assignment_id,user_id" }).select().single().then(function (r) {
              if (r.error) { fm.textContent = "실패: " + r.error.message; fm.className = "fmsg err"; return; }
              mySubs[id] = r.data;
              render();
            });
          });
        });

        var nf = document.getElementById("newForm");
        if (nf) nf.addEventListener("submit", function (e) {
          e.preventDefault();
          var f = e.target, fm = document.getElementById("newMsg");
          fm.textContent = "등록 중…"; fm.className = "fmsg";
          db.from("assignments").insert({
            title: f.title.value.trim(),
            detail_url: f.detail_url.value.trim(),
            generation: f.generation.value === "" ? null : Number(f.generation.value),
            due_date: f.due_date.value || null,
            created_by: me.id
          }).select().single().then(function (r) {
            if (r.error) { fm.textContent = "실패: " + r.error.message; fm.className = "fmsg err"; return; }
            assignments.unshift(r.data);
            render();
          });
        });
      }

      window.addEventListener("DOMContentLoaded", async function () {
        if (!window.yvAuth) return;
        var user = await yvAuth.requireAuth();
        if (!user) return;
        db = yvAuth.client;

        var pr = await db.from("profiles").select("display_name, is_member, is_admin").eq("id", user.id).maybeSingle();
        var p = pr.data;
        if (!p || (!p.is_member && !p.is_admin)) {
          msg("학회원 전용 공간입니다.<br />승인이 필요하면 운영진에게 가입 이메일(" + esc(user.email || "") + ")을 알려주세요.");
          return;
        }
        me = { id: user.id, display_name: p.display_name, is_admin: p.is_admin };

        var r = await db.from("assignments").select("*").order("created_at", { ascending: false });
        if (r.error) {
          msg("불러오지 못했습니다: " + esc(r.error.message) + "<br />migration-phase4.sql 을 실행했는지 확인하세요.");
          return;
        }
        assignments = r.data || [];

        var rs = await db.from("assignment_submissions").select("*");
        (rs.data || []).forEach(function (s) {
          if (s.user_id === me.id) mySubs[s.assignment_id] = s;
          (allSubs[s.assignment_id] = allSubs[s.assignment_id] || []).push(s);
        });

        render();
      });
    })();
  </script>
  <script>
    (function () {
      var hb = document.getElementById("hamburger");
      var nm = document.getElementById("navMenu");
      if (hb && nm) hb.addEventListener("click", function () { nm.classList.toggle("open"); });
    })();
  </script>
