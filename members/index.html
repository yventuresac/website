<!DOCTYPE html>
<html lang="ko" class="yv-gated">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <title>학회원 페이지 — Y-VENTURES</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../css/style.css?v=20260820" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-guard.js"></script>
  <style>
    /* 이 페이지만 히어로를 낮게 — 허브는 표지가 아니라 도구라서
       첫 화면에 카드가 보여야 한다 */
    .page-header { padding: 118px var(--space-3xl) 42px; }
    .page-title { font-size: clamp(30px, 5vw, 42px); }
    .page-desc { margin-top: 10px; font-size: var(--text-body-sm); }
    @media (max-width: 640px) { .page-header { padding: 96px 20px 34px; } }

    .mb-wrap { max-width: 880px; margin: 0 auto; }

    /* ── 새 소식 — 마지막 방문 이후 생긴 항목에 NEW 가 붙는다 ── */
    .mb-news { margin-bottom: var(--space-xl); }
    .mb-news-list { display: grid; gap: 8px; }
    .mb-news-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border: 1px solid var(--edge); border-radius: 12px;
      background: var(--bg-card); text-decoration: none;
      font-size: 13px; color: var(--text-2);
      transition: border-color 0.2s var(--ease-out);
    }
    a.mb-news-item:hover { border-color: var(--edge-hover); color: var(--text-1); }
    a.mb-news-item:focus-visible { outline: 2px solid var(--blue-300); outline-offset: 3px; }
    .mb-news-kind { flex: none; font-size: 11px; letter-spacing: var(--ls-wide);
                    padding: 2px 9px; border-radius: 999px; border: 1px solid var(--edge); color: var(--text-3); }
    .mb-news-kind.k-program    { border-color: rgba(96,165,250,.4);  color: #93C5FD; }
    .mb-news-kind.k-insight    { border-color: rgba(167,139,250,.4); color: #C4B5FD; }
    .mb-news-kind.k-newsletter { border-color: rgba(52,211,153,.4);  color: #6EE7B7; }
    .mb-news-kind.k-notice     { border-color: rgba(251,191,36,.4);  color: #FCD34D; }
    .mb-news-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mb-new { flex: none; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #FCA5A5; }
    .mb-news-date { flex: none; font-size: 12px; color: var(--text-3); }
    .mb-news-x { flex: none; background: none; border: none; padding: 0 2px; cursor: pointer;
                 color: var(--text-3); font-size: 14px; line-height: 1; font-family: inherit; }
    .mb-news-x:hover { color: #FCA5A5; }
    /* 운영진용 소식 등록 폼 — 평소엔 접혀 있다 */
    .mb-news-add-toggle { background: none; border: none; padding: 0; cursor: pointer;
                          font-size: 12px; color: var(--text-3); font-family: 'Pretendard', sans-serif; }
    .mb-news-add-toggle:hover { color: var(--text-1); }
    .mb-news-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .mb-news-form[hidden] { display: none; }
    .mb-news-form select, .mb-news-form input {
      padding: 9px 12px; font-size: 13px; font-family: 'Pretendard', sans-serif;
      color: var(--text-1); background: var(--bg-base);
      border: 1px solid var(--edge); border-radius: 10px;
    }
    .mb-news-form input:focus, .mb-news-form select:focus { outline: none; border-color: var(--edge-hover); }
    .mb-news-form .f-title { flex: 2; min-width: 180px; }
    .mb-news-form .f-url { flex: 2; min-width: 160px; }
    .mb-news-msg { width: 100%; margin: 2px 0 0; font-size: 12px; min-height: 16px; color: var(--text-3); }
    .mb-news-msg.err { color: #FCA5A5; }

    /* ── 인사 카드 ──
       시그니처는 기수 워터마크다. 이 시스템의 축이 기수라서
       장식이 아니라 내용이다. */
    .mb-hello {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      padding: var(--space-xl) var(--space-lg);
      margin-bottom: var(--space-xl);
      border: 1px solid var(--edge); border-radius: 20px;
      background:
        radial-gradient(ellipse 480px 260px at 12% -30%, rgba(96,165,250,0.10), transparent 65%),
        var(--bg-card);
      box-shadow: var(--glow);
    }
    .mb-mark {
      position: absolute; right: 18px; bottom: -34px;
      font-size: 150px; font-weight: 800; line-height: 1;
      letter-spacing: -0.06em; color: rgba(255,255,255,0.045);
      user-select: none; pointer-events: none; white-space: nowrap;
    }
    .mb-avatar {
      flex: none; width: 58px; height: 58px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
      background: rgba(96,165,250,0.16); color: #93C5FD;
      border: 1px solid rgba(96,165,250,0.35);
    }
    .mb-avatar.member { background: rgba(110,231,183,0.14); color: #6EE7B7; border-color: rgba(110,231,183,0.32); }
    .mb-hello-body { flex: 1; min-width: 0; position: relative; }
    .mb-hello h2 { margin: 0 0 4px; font-size: clamp(24px, 4vw, 32px); letter-spacing: var(--ls-snug); color: var(--text-1); }
    .mb-hello .sub { margin: 0; font-size: var(--text-body-sm); color: var(--text-3); }
    .mb-badge { display: inline-block; margin-left: 10px; padding: 3px 11px; border-radius: 999px;
                font-size: 12px; letter-spacing: var(--ls-wide); vertical-align: 6px;
                border: 1px solid rgba(110,231,183,.4); color: #6EE7B7; }
    .mb-badge.outside { border-color: var(--edge); color: var(--text-3); }
    .mb-badge.admin { border-color: rgba(96,165,250,.5); color: #93C5FD; }
    .mb-hello .btn { position: relative; }

    /* ── 기능 카드 ── */
    .mb-eyebrow {
      font-size: var(--text-eyebrow); font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
      color: var(--text-3); margin: 0 0 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .mb-eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--edge); }
    .mb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mb-card {
      position: relative;
      display: flex; gap: 14px; align-items: flex-start;
      padding: 18px;
      border: 1px solid var(--edge); border-radius: 16px; background: var(--bg-card);
      text-decoration: none;
      transition: border-color 0.22s var(--ease-out), transform 0.22s var(--ease-out), box-shadow 0.22s var(--ease-out);
    }
    a.mb-card:hover { border-color: var(--edge-hover); transform: translateY(-3px); box-shadow: var(--glow-hover); }
    a.mb-card:focus-visible { outline: 2px solid var(--blue-300); outline-offset: 3px; }
    .mb-ico {
      flex: none; width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .mb-ico svg { width: 20px; height: 20px; }
    /* 역할별 틴트 — 뉴스레터 지면과 같은 팔레트를 잇는다 */
    .t-blue   { background: rgba(96,165,250,0.13);  color: #93C5FD; }
    .t-purple { background: rgba(167,139,250,0.13); color: #C4B5FD; }
    .t-green  { background: rgba(52,211,153,0.13);  color: #6EE7B7; }
    .t-pink   { background: rgba(244,114,182,0.13); color: #F9A8D4; }
    .t-yellow { background: rgba(251,191,36,0.13);  color: #FCD34D; }
    .t-orange { background: rgba(251,146,60,0.13);  color: #FDBA74; }
    .t-cyan   { background: rgba(34,211,238,0.13);  color: #67E8F9; }
    .mb-card-body { min-width: 0; flex: 1; }
    .mb-card h3 {
      margin: 0 0 5px; font-size: var(--text-body-lg); color: var(--text-1);
      letter-spacing: var(--ls-snug);
      display: flex; align-items: center; gap: 6px;
    }
    .mb-card h3 .arr { opacity: 0; transform: translateX(-4px); transition: opacity 0.2s, transform 0.2s var(--ease-out); color: var(--text-3); }
    a.mb-card:hover h3 .arr { opacity: 1; transform: translateX(0); }
    .mb-card p { margin: 0; font-size: var(--text-body-sm); color: var(--text-2); line-height: var(--lh-normal); }

    /* 입장 모션 — 카드가 순서대로 떠오른다 */
    @keyframes mbRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .mb-hello, .mb-card, .mb-eyebrow { animation: mbRise 0.45s var(--ease-out) both; }

    .mb-gate {
      padding: var(--space-2xl) var(--space-md); text-align: center; color: var(--text-3);
      border: 1px dashed var(--edge); border-radius: 16px; line-height: var(--lh-relaxed);
    }
    .mb-gate a { color: #93C5FD; }
    .mb-net, .mb-admin { margin-top: var(--space-2xl); }

    @media (max-width: 640px) {
      .mb-grid { grid-template-columns: 1fr; }
      .mb-mark { font-size: 110px; bottom: -26px; right: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mb-hello, .mb-card, .mb-eyebrow { animation: none; }
      a.mb-card, .mb-card h3 .arr { transition: none; }
      a.mb-card:hover { transform: none; }
    }
  </style>
</head>
<body class="theme-mono">

  <nav id="nav" class="scrolled">
    <a href="/index.html" class="nav-logo" aria-label="Y-VENTURES 홈">
      <img src="../assets/logo.png" alt="Y-VENTURES" />
    </a>
  </nav>

  <div class="page-header">
    <div class="page-tag">Members</div>
    <h1 class="page-title">학회원 페이지</h1>
    <p class="page-desc">Y-VENTURES 구성원을 위한 공간입니다.</p>
  </div>

  <section class="section">
    <div class="mb-wrap" id="root">
      <div class="mb-gate">불러오는 중…</div>
    </div>
  </section>

  <script>
    (function () {
      var root = document.getElementById("root");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      /* 스트로크 아이콘. 이모지는 플랫폼마다 제각각이라 쓰지 않는다. */
      var I = {
        pen:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        board:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
        folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
        mega:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2-8Z"/></svg>',
        clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
        upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 9 5-5 5 5"/><path d="M12 4v12"/></svg>',
        users:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        gear:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>',
        chart:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3"/><path d="M12 10v8"/><path d="M17 6v12"/></svg>',
        inbox:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1z"/></svg>',
        ledger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M9 4v16"/></svg>',
        camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'
      };

      function card(href, tint, icon, title, desc) {
        /* 외부 문서(구글 시트 등)는 새 탭으로 — 허브를 떠나지 않게 한다 */
        var ext = /^https?:\/\//.test(href) ? ' target="_blank" rel="noopener"' : '';
        return '<a class="mb-card" href="' + href + '"' + ext + '>' +
          '<span class="mb-ico ' + tint + '">' + I[icon] + '</span>' +
          '<span class="mb-card-body"><h3>' + title +
          '<span class="arr" aria-hidden="true">→</span></h3>' +
          '<p>' + desc + '</p></span></a>';
      }

      function helloHtml(p, user) {
        var name = p && p.display_name ? p.display_name
                 : (user.user_metadata && user.user_metadata.full_name) || user.email.split("@")[0];
        var badge, avatarCls = "mb-avatar", mark;
        if (p && p.is_admin) {
          badge = '<span class="mb-badge admin">운영진</span>';
          mark = p.generation != null ? p.generation + "기" : "YV";
        } else if (p && p.is_member) {
          badge = '<span class="mb-badge">' + (p.generation != null ? p.generation + "기 " : "") + (p.is_alumni ? "알럼" : "학회원") + '</span>';
          avatarCls += " member";
          mark = p.generation != null ? p.generation + "기" : "YV";
        } else {
          badge = '<span class="mb-badge outside">승인 대기</span>';
          mark = "YV";
        }
        var initial = (name || "Y").trim().charAt(0).toUpperCase();
        return '<div class="mb-hello">' +
          '<div class="mb-mark" aria-hidden="true">' + esc(mark) + '</div>' +
          '<div class="' + avatarCls + '" aria-hidden="true">' + esc(initial) + '</div>' +
          '<div class="mb-hello-body"><h2>' + esc(name) + '님' + badge + '</h2>' +
          '<p class="sub">' + esc(user.email || "") + '</p></div>' +
          '<button type="button" class="btn btn-outline" id="logoutBtn">로그아웃</button>' +
          '</div>';
      }

      /* 두 구획으로 나눈다.
         Workspace — 학기 중 매주 쓰는 것 (글·자료·과제)
         Network & Records — 가끔 들르는 것 (사람·기록)
         섞어두면 매주 쓸 네 개가 일곱 개 사이에 묻힌다. */
      function memberCards() {
        return '<p class="mb-eyebrow">Workspace</p><div class="mb-grid">' +
          card("/insights/write.html", "t-blue",   "pen",    "Insights 글쓰기", "산업·시장 인사이트를 작성해 게시판에 올립니다.") +
          card("/insights/",           "t-purple", "board",  "Insights 게시판", "학회원들이 쓴 글을 읽고 반응을 남깁니다.") +
          card("/members/resources.html", "t-green", "folder", "기수별 자료실", "세션 자료·템플릿·노션/드라이브 링크를 기수별로 모아둡니다.") +
          card("/members/assignments.html", "t-orange", "upload", "과제 제출", "커리큘럼 과제를 링크로 제출합니다.") +
          '</div>' +
          '<div class="mb-net"><p class="mb-eyebrow">Network &amp; Records</p><div class="mb-grid">' +
          card("/members/alumni.html", "t-cyan", "users", "알럼 디렉터리", "기수별 알럼을 찾아보고 연결을 요청합니다.") +
          card("/members/alumni-news.html", "t-pink", "mega", "동문 창업가 제보", "선배 창업가 소식을 공유하는 창구. 뉴스레터 재료가 됩니다.") +
          card("/members/activity.html", "t-yellow", "clock", "내 활동 기록", "참여한 프로그램과 역할을 기록해 이력으로 활용합니다.") +
          card("https://drive.google.com/drive/folders/0ABJ2MfzPfD_lUk9PVA", "t-purple", "camera", "사진 모음", "행사·세션 사진 드라이브. 열람 권한은 구글 계정 기준입니다.") +
          '</div></div>';
      }

      function adminCards() {
        return '<div class="mb-admin"><p class="mb-eyebrow">Admin</p><div class="mb-grid">' +
          card("/admin-tools/users.html", "t-blue", "gear", "회원 관리", "가입 승인, 기수 지정, 등급 변경.") +
          card("/admin-tools/applications.html", "t-blue", "inbox", "지원서 관리", "Tally 접수분 열람과 심사 상태 변경.") +
          card("/admin-tools/stats.html", "t-blue", "chart", "사이트 통계", "방문·유입 경로·버튼 클릭 집계.") +
          card("https://docs.google.com/spreadsheets/d/1xMRz4BBgUBlw_AUM-pASfvXlUGLrvNXv/edit", "t-blue", "ledger", "회계 장부", "구글 시트로 열립니다. 열람 권한은 구글 계정 기준입니다.") +
          '</div></div>';
      }

      function gateHtml(user) {
        return '<div class="mb-gate">' +
          '계정은 만들어졌지만 아직 학회원 승인 전입니다.<br />' +
          'Y-VENTURES 학회원이라면 운영진에게 가입 이메일(' + esc(user.email || "") + ')을 알려주세요.<br /><br />' +
          '프로그램에 지원하셨다면 <a href="/apply/status.html">지원 현황</a>에서 진행 상황을 볼 수 있습니다.' +
          '</div>';
      }

      /* 카드가 위에서부터 순서대로 떠오르게 지연을 배분한다 */
      function stagger() {
        var els = root.querySelectorAll(".mb-hello, .mb-eyebrow, .mb-card");
        for (var i = 0; i < els.length; i++) els[i].style.animationDelay = (i * 45) + "ms";
      }

      /* ── 소식 등록 (운영진 전용) ──
         학회원에게는 안 보인다 — 알림은 상단 네비의 벨이 담당한다.
         여기는 벨에 흘려보낼 소식을 등록·정리하는 운영 도구다. */
      var KIND = { program: "프로그램", insight: "인사이트", newsletter: "뉴스레터", notice: "공지" };

      function newsItemHtml(u) {
        var date = String(u.created_at).slice(0, 10).replace(/-/g, ".");
        var inner = '<span class="mb-news-kind k-' + esc(u.kind) + '">' + esc(KIND[u.kind] || u.kind) + '</span>' +
          '<span class="mb-news-title">' + esc(u.title) + '</span>' +
          '<span class="mb-news-date">' + esc(date) + '</span>' +
          '<button type="button" class="mb-news-x" data-delnews="' + u.id + '" aria-label="소식 삭제">×</button>';
        return '<div class="mb-news-item">' + inner + '</div>';
      }

      async function loadNews(db, user, isAdmin) {
        var slot = document.getElementById("newsSlot");
        if (!slot || !isAdmin) return;
        var r;
        try {
          r = await db.from("site_updates").select("*")
            .order("created_at", { ascending: false }).limit(6);
        } catch (e) { return; }
        /* 테이블이 아직 없으면(마이그레이션 전) 섹션 자체를 숨긴다 */
        if (!r || r.error) return;
        var rows = r.data || [];

        function paint() {
          var adminHtml =
            '<div><button type="button" class="mb-news-add-toggle" id="newsToggle">+ 소식 등록 — 학회원 알림(벨)으로 나갑니다</button>' +
            '<form class="mb-news-form" id="newsForm" hidden>' +
            '<select name="kind"><option value="notice">공지</option><option value="program">프로그램</option><option value="newsletter">뉴스레터</option></select>' +
            '<input class="f-title" name="title" required maxlength="200" placeholder="예: Boost Program 5기 모집 시작" />' +
            '<input class="f-url" name="url" placeholder="링크 (선택) — /boost/ 또는 https://..." />' +
            '<button type="submit" class="btn btn-black" style="padding:9px 16px;font-size:13px">등록</button>' +
            '<p class="mb-news-msg" id="newsMsg">링크를 넣으면 그 메뉴에 배지가 붙습니다. Insights 새 글은 자동 등록됩니다.</p>' +
            '</form>' +
            (rows.length ? '<div class="mb-news-list" style="margin-top:10px">' + rows.map(newsItemHtml).join("") + '</div>' : '') +
            '</div>';
          slot.innerHTML = adminHtml;

          slot.querySelectorAll("[data-delnews]").forEach(function (b) {
            b.addEventListener("click", function (e) {
              e.preventDefault(); e.stopPropagation();
              if (!confirm("이 소식을 목록에서 삭제할까요?")) return;
              var id = Number(b.getAttribute("data-delnews"));
              db.from("site_updates").delete().eq("id", id).then(function (dr) {
                if (dr.error) { alert("삭제 실패: " + dr.error.message); return; }
                rows = rows.filter(function (x) { return x.id !== id; });
                paint();
              });
            });
          });

          var tg = document.getElementById("newsToggle");
          if (tg) tg.addEventListener("click", function () {
            var f = document.getElementById("newsForm");
            f.hidden = !f.hidden;
            if (!f.hidden) f.title.focus();
          });
          var nf = document.getElementById("newsForm");
          if (nf) nf.addEventListener("submit", function (e) {
            e.preventDefault();
            var fm = document.getElementById("newsMsg");
            var url = nf.url.value.trim();
            if (url && !/^(\/|https?:\/\/)/.test(url)) {
              fm.textContent = "링크는 / 또는 https:// 로 시작해야 합니다."; fm.className = "mb-news-msg err"; return;
            }
            fm.textContent = "등록 중…"; fm.className = "mb-news-msg";
            db.from("site_updates").insert({
              kind: nf.kind.value, title: nf.title.value.trim(), url: url, created_by: user.id
            }).select().single().then(function (ir) {
              if (ir.error) { fm.textContent = "실패: " + ir.error.message; fm.className = "mb-news-msg err"; return; }
              rows.unshift(ir.data);
              paint();
            });
          });
        }

        paint();
      }

      window.addEventListener("DOMContentLoaded", async function () {
        if (!window.yvAuth) return;
        var user = await yvAuth.requireAuth();
        if (!user) return;

        var db = yvAuth.client;
        var p = null;
        try {
          var r = await db.from("profiles")
            .select("display_name, generation, is_member, is_alumni, is_admin").eq("id", user.id).maybeSingle();
          p = r.data;
        } catch (e) {}

        var html = helloHtml(p, user);
        html += '<div class="mb-news" id="newsSlot"></div>';
        if (p && (p.is_member || p.is_admin)) {
          html += memberCards();
          if (p.is_admin) html += adminCards();
        } else {
          html += gateHtml(user);
        }
        root.innerHTML = html;
        stagger();
        loadNews(db, user, !!(p && p.is_admin));

        document.getElementById("logoutBtn").addEventListener("click", async function () {
          await yvAuth.signOut();
          window.location.href = "/index.html";
        });
      });
    })();
  </script>
</body>
</html>
