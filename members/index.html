<!DOCTYPE html>
<html lang="ko" class="yv-gated">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <title>학회원 페이지 — Y-VENTURES</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../css/style.css?v=20260820" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-guard.js"></script>
  <style>
    .mb-wrap { max-width: 880px; margin: 0 auto; }
    .mb-hello {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: var(--space-lg); margin-bottom: var(--space-lg);
      border: 1px solid var(--edge); border-radius: 16px; background: var(--bg-card);
    }
    .mb-hello h2 { margin: 0 0 6px; font-size: var(--text-h3); letter-spacing: var(--ls-snug); color: var(--text-1); }
    .mb-hello p { margin: 0; font-size: var(--text-body-sm); color: var(--text-3); }
    .mb-badge { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px;
                font-size: 12px; letter-spacing: var(--ls-wide); vertical-align: 3px;
                border: 1px solid rgba(110,231,183,.4); color: #6EE7B7; }
    .mb-badge.outside { border-color: var(--edge); color: var(--text-3); }
    .mb-badge.admin { border-color: rgba(96,165,250,.5); color: #93C5FD; }
    .mb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mb-card {
      display: block; padding: var(--space-md);
      border: 1px solid var(--edge); border-radius: 14px; background: var(--bg-card);
      text-decoration: none;
      transition: border-color 0.2s var(--ease-out), transform 0.2s var(--ease-out);
    }
    a.mb-card:hover { border-color: var(--edge-hover); transform: translateY(-2px); }
    a.mb-card:focus-visible { outline: 2px solid var(--blue-300); outline-offset: 3px; }
    .mb-card h3 { margin: 0 0 6px; font-size: var(--text-body-lg); color: var(--text-1); letter-spacing: var(--ls-snug); }
    .mb-card p { margin: 0; font-size: var(--text-body-sm); color: var(--text-2); line-height: var(--lh-normal); }
    .mb-card.soon { opacity: 0.55; }
    .mb-card.soon h3::after {
      content: "준비 중"; margin-left: 8px; font-size: 11px; letter-spacing: var(--ls-wide);
      color: var(--text-3); border: 1px solid var(--edge); border-radius: 999px; padding: 2px 8px;
      vertical-align: 2px; font-weight: 400;
    }
    .mb-gate {
      padding: var(--space-xl) var(--space-md); text-align: center; color: var(--text-3);
      border: 1px dashed var(--edge); border-radius: 12px; line-height: var(--lh-relaxed);
    }
    .mb-admin { margin-top: var(--space-2xl); }
    @media (max-width: 640px) { .mb-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      a.mb-card { transition: none; }
      a.mb-card:hover { transform: none; }
    }
  </style>
</head>
<body class="theme-mono">

  <nav id="nav" class="scrolled">
    <a href="/index.html" class="nav-logo" aria-label="Y-VENTURES 홈">
      <img src="../assets/logo.png" alt="Y-VENTURES" />
    </a>
  </nav>

  <div class="page-header">
    <div class="page-tag">Members</div>
    <h1 class="page-title">학회원 페이지</h1>
    <p class="page-desc">Y-VENTURES 구성원을 위한 공간입니다.</p>
  </div>

  <section class="section">
    <div class="mb-wrap" id="root">
      <div class="mb-gate">불러오는 중…</div>
    </div>
  </section>

  <script>
    (function () {
      var root = document.getElementById("root");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function helloHtml(p, user) {
        var name = p && p.display_name ? p.display_name
                 : (user.user_metadata && user.user_metadata.full_name) || user.email.split("@")[0];
        var badge;
        if (p && p.is_admin) badge = '<span class="mb-badge admin">운영진</span>';
        else if (p && p.is_member) badge = '<span class="mb-badge">' + (p.generation != null ? p.generation + "기 " : "") + (p.is_alumni ? "알럼" : "학회원") + '</span>';
        else badge = '<span class="mb-badge outside">승인 대기</span>';
        return '<div class="mb-hello"><div>' +
               '<h2>' + esc(name) + '님' + badge + '</h2>' +
               '<p>' + esc(user.email || "") + '</p>' +
               '</div><button type="button" class="btn btn-outline" id="logoutBtn">로그아웃</button></div>';
      }

      /* 학회원 기능. 열려 있는 것은 링크, 나머지는 준비 중 표시.
         '준비 중' 카드를 미리 보여주는 이유: 무엇이 생길지 알아야 다시 온다. */
      function memberCards() {
        return '<div class="mb-grid">' +
          '<a class="mb-card" href="/insights/write.html"><h3>Insights 글쓰기</h3><p>산업·시장 인사이트를 작성해 게시판에 올립니다.</p></a>' +
          '<a class="mb-card" href="/insights/"><h3>Insights 게시판</h3><p>학회원들이 쓴 글을 읽고 반응을 남깁니다.</p></a>' +
          '<div class="mb-card soon"><h3>기수별 자료실</h3><p>세션 자료·템플릿·노션/드라이브 링크를 기수별로 모아둡니다.</p></div>' +
          '<div class="mb-card soon"><h3>동문 창업가 제보</h3><p>선배 창업가 소식을 알게 되면 공유하는 창구. 뉴스레터 재료가 됩니다.</p></div>' +
          '<div class="mb-card soon"><h3>내 활동 기록</h3><p>참여한 프로그램과 역할을 기록해 이력으로 활용합니다.</p></div>' +
          '<div class="mb-card soon"><h3>알럼 디렉터리</h3><p>기수별 알럼을 찾아보고 연결을 요청합니다.</p></div>' +
          '</div>';
      }

      function adminCards() {
        return '<div class="mb-admin"><div class="eyebrow" style="margin-bottom:12px">운영진</div>' +
          '<div class="mb-grid">' +
          '<a class="mb-card" href="/admin-tools/users.html"><h3>회원 관리</h3><p>가입 승인, 기수 지정, 등급 변경.</p></a>' +
          '<a class="mb-card" href="/admin-tools/stats.html"><h3>사이트 통계</h3><p>방문·유입 경로·버튼 클릭 집계.</p></a>' +
          '</div></div>';
      }

      function gateHtml(user) {
        return '<div class="mb-gate">' +
          '계정은 만들어졌지만 아직 학회원 승인 전입니다.<br />' +
          'Y-VENTURES 학회원이라면 운영진에게 가입 이메일(' + esc(user.email || "") + ')을 알려주세요.' +
          '</div>';
      }

      window.addEventListener("DOMContentLoaded", async function () {
        if (!window.yvAuth) return;
        var user = await yvAuth.requireAuth();
        if (!user) return;

        var db = yvAuth.client;
        var p = null;
        try {
          var r = await db.from("profiles")
            .select("display_name, generation, is_member, is_alumni, is_admin").eq("id", user.id).maybeSingle();
          p = r.data;
        } catch (e) {}

        var html = helloHtml(p, user);
        if (p && (p.is_member || p.is_admin)) {
          html += memberCards();
          if (p.is_admin) html += adminCards();
        } else {
          html += gateHtml(user);
        }
        root.innerHTML = html;

        document.getElementById("logoutBtn").addEventListener("click", async function () {
          await yvAuth.signOut();
          window.location.href = "/index.html";
        });
      });
    })();
  </script>
</body>
</html>
