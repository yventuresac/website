<!DOCTYPE html>
<html lang="ko" class="yv-gated">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <title>학회원 페이지 — Y-VENTURES</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../css/style.css?v=20260820" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/nav-auth.js?v=2"></script>
  <script src="/js/members-guide.js?v=1"></script>
  <script src="/js/members-checklist.js?v=2"></script>
  <style>
    /* 이 페이지만 히어로를 낮게 — 허브는 표지가 아니라 도구라서
       첫 화면에 카드가 보여야 한다 */
    .page-header { padding: 118px var(--space-3xl) 42px; }
    .page-title { font-size: clamp(30px, 5vw, 42px); }
    .page-desc { margin-top: 10px; font-size: var(--text-body-sm); }
    @media (max-width: 640px) { .page-header { padding: 96px 20px 34px; } }

    .mb-wrap { max-width: 880px; margin: 0 auto; }

    /* ── 캘린더 — 학회 일정. 월간은 훑기용, 주간은 세부까지 ── */
    .mb-cal { margin-bottom: var(--space-2xl); }
    .cal-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .cal-label { font-size: 17px; font-weight: 700; color: var(--text-1); letter-spacing: var(--ls-snug); margin-right: auto; }
    .cal-btn { padding: 7px 12px; font-size: 12px; border-radius: 8px; cursor: pointer;
               background: none; border: 1px solid var(--edge); color: var(--text-2); font-family: 'Pretendard', sans-serif; }
    .cal-btn:hover { border-color: var(--edge-hover); color: var(--text-1); }
    .cal-btn.on { border-color: rgba(96,165,250,.55); color: #93C5FD; background: rgba(96,165,250,.08); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
                background: var(--edge); border: 1px solid var(--edge); border-radius: 14px; overflow: hidden; }
    .cal-dow { padding: 8px 0; text-align: center; font-size: 10px; letter-spacing: var(--ls-wide);
               color: var(--text-3); background: var(--bg-card); }
    .cal-cell { min-height: 88px; padding: 6px; background: var(--bg-card); cursor: pointer; }
    .cal-cell .d { font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
    .cal-cell.out { background: rgba(255,255,255,0.015); }
    .cal-cell.out .d { opacity: .4; }
    .cal-cell.today .d { color: #93C5FD; font-weight: 700; }
    /* 일요일·공휴일은 빨간 날 */
    .cal-dow.sun { color: #F87171; }
    .cal-cell .d.red { color: #F87171; }
    .cal-cell .d .hname { font-size: 9px; font-weight: 400; color: #F87171; margin-left: 3px; }
    .cal-day > h4 .hname { color: #F87171; font-weight: 400; margin-left: 6px; }
    .cal-day.red > h4 { color: #F87171; }
    .cal-chip { display: block; width: 100%; text-align: left; margin-bottom: 3px; padding: 3px 6px 4px;
                border: none; border-left: 2px solid; border-radius: 5px; cursor: pointer; font-family: 'Pretendard', sans-serif; }
    .cal-chip b { display: block; font-size: 11px; font-weight: 600; color: var(--text-1);
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-chip small { display: block; font-size: 10px; color: var(--text-3);
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-study   { background: rgba(52,211,153,.10); border-color: #6EE7B7; }
    .c-project { background: rgba(251,146,60,.10); border-color: #FDBA74; }
    .c-event   { background: rgba(96,165,250,.10); border-color: #93C5FD; }
    .c-insight { background: rgba(167,139,250,.10); border-color: #C4B5FD; }
    .c-reading { background: rgba(244,114,182,.10); border-color: #F9A8D4; }
    .c-break   { background: rgba(148,163,184,.10); border-color: #CBD5E1; }
    /* 주간 — 하루가 한 줄, 세부 내용까지 그대로 보인다 */
    .cal-week { display: grid; gap: 8px; }
    .cal-day { border: 1px solid var(--edge); border-radius: 12px; background: var(--bg-card); padding: 10px 14px; cursor: pointer; }
    .cal-day > h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-3); }
    .cal-day.today > h4 { color: #93C5FD; }
    .cal-day .none { font-size: 12px; color: var(--text-3); opacity: .6; }
    .cal-ev { padding: 9px 12px; border-radius: 8px; border-left: 2px solid; margin-bottom: 6px; cursor: pointer; }
    .cal-ev h5 { margin: 0; font-size: 15px; color: var(--text-1); letter-spacing: var(--ls-snug); }
    .cal-ev h5 small { font-weight: 400; font-size: 11px; color: var(--text-3); margin-left: 6px; }
    .cal-ev p { margin: 3px 0 0; font-size: 12px; color: var(--text-2); line-height: 1.5; }
    .cal-mention { color: #93C5FD; font-weight: 600; }
    /* 등록·상세 대화상자 */
    .cal-dialog { border: 1px solid var(--edge); border-radius: 16px; background: var(--bg-elevated);
                  color: var(--text-1); padding: var(--space-lg); max-width: 460px; width: 92vw; }
    .cal-dialog::backdrop { background: rgba(0,0,0,.6); }
    .cal-dialog h2 { margin: 0 0 14px; font-size: 19px; letter-spacing: var(--ls-snug); }
    .cal-dialog label { display: block; margin-bottom: 12px; }
    .cal-dialog label span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-2); }
    .cal-dialog input, .cal-dialog select, .cal-dialog textarea {
      width: 100%; padding: 10px 13px; font-size: 14px; font-family: 'Pretendard', sans-serif;
      color: var(--text-1); background: var(--bg-base); border: 1px solid var(--edge); border-radius: 10px;
    }
    .cal-dialog textarea { min-height: 90px; resize: vertical; }
    .cal-dialog input:focus, .cal-dialog select:focus, .cal-dialog textarea:focus { outline: none; border-color: var(--edge-hover); }
    /* label 의 display:block 이 hidden 속성을 덮어쓰지 않게 — 행사 종류가
       분류와 무관하게 항상 보이던 버그의 원인 */
    .cal-dialog [hidden] { display: none !important; }
    .cal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cal-dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .cal-sug { border: 1px solid var(--edge); border-radius: 10px; background: var(--bg-base); overflow: hidden; margin: -6px 0 12px; }
    .cal-sug button { display: block; width: 100%; text-align: left; padding: 8px 13px; font-size: 13px;
                      background: none; border: none; color: var(--text-2); cursor: pointer; font-family: 'Pretendard', sans-serif; }
    .cal-sug button:hover { background: rgba(255,255,255,.06); color: var(--text-1); }
    .cal-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px;
                 letter-spacing: var(--ls-wide); border: 1px solid; margin-bottom: 10px; }
    .b-study   { border-color: rgba(52,211,153,.4); color: #6EE7B7; }
    .b-project { border-color: rgba(251,146,60,.4); color: #FDBA74; }
    .b-event   { border-color: rgba(96,165,250,.4); color: #93C5FD; }
    .b-insight { border-color: rgba(167,139,250,.4); color: #C4B5FD; }
    .b-reading { border-color: rgba(244,114,182,.4); color: #F9A8D4; }
    .b-break   { border-color: rgba(148,163,184,.4); color: #CBD5E1; }
    .cal-view-meta { font-size: 12px; color: var(--text-3); margin: 0 0 10px; }
    .cal-view-detail { font-size: 14px; color: var(--text-2); line-height: 1.6; margin: 0; white-space: pre-wrap; }
    .fmsg { margin: 0 0 8px; font-size: 13px; min-height: 16px; color: var(--text-3); }
    .fmsg.err { color: #FCA5A5; }

    /* ── 인사 카드 ──
       시그니처는 기수 워터마크다. 이 시스템의 축이 기수라서
       장식이 아니라 내용이다. */
    .mb-hello {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      padding: var(--space-xl) var(--space-lg);
      margin-bottom: var(--space-xl);
      border: 1px solid var(--edge); border-radius: 20px;
      background:
        radial-gradient(ellipse 480px 260px at 12% -30%, rgba(96,165,250,0.10), transparent 65%),
        var(--bg-card);
      box-shadow: var(--glow);
    }
    .mb-mark {
      position: absolute; right: 18px; bottom: -34px;
      font-size: 150px; font-weight: 800; line-height: 1;
      letter-spacing: -0.06em; color: rgba(255,255,255,0.045);
      user-select: none; pointer-events: none; white-space: nowrap;
    }
    .mb-avatar {
      flex: none; width: 58px; height: 58px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
      background: rgba(96,165,250,0.16); color: #93C5FD;
      border: 1px solid rgba(96,165,250,0.35);
    }
    .mb-avatar.member { background: rgba(110,231,183,0.14); color: #6EE7B7; border-color: rgba(110,231,183,0.32); }
    .mb-hello-body { flex: 1; min-width: 0; position: relative; }
    .mb-hello h2 { margin: 0 0 4px; font-size: clamp(24px, 4vw, 32px); letter-spacing: var(--ls-snug); color: var(--text-1); }
    .mb-hello .sub { margin: 0; font-size: var(--text-body-sm); color: var(--text-3); }
    .mb-badge { display: inline-block; margin-left: 10px; padding: 3px 11px; border-radius: 999px;
                font-size: 12px; letter-spacing: var(--ls-wide); vertical-align: 6px;
                border: 1px solid rgba(110,231,183,.4); color: #6EE7B7; }
    .mb-badge.outside { border-color: var(--edge); color: var(--text-3); }
    .mb-badge.admin { border-color: rgba(96,165,250,.5); color: #93C5FD; }
    .mb-hello .btn { position: relative; }
    .mb-guide-link {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 10px; padding: 0; background: none; border: none; cursor: pointer;
      font-family: 'Pretendard', sans-serif; font-size: 12.5px; color: var(--text-3);
      text-decoration: underline; text-decoration-color: rgba(255,255,255,.18); text-underline-offset: 3px;
      transition: color 0.2s var(--ease-out), text-decoration-color 0.2s var(--ease-out);
    }
    .mb-guide-link:hover { color: #93C5FD; text-decoration-color: rgba(147,197,253,.5); }
    .mb-guide-link:focus-visible { outline: 2px solid var(--blue-300); outline-offset: 3px; border-radius: 4px; }

    /* ── 기능 카드 ── */
    .mb-eyebrow {
      font-size: var(--text-eyebrow); font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
      color: var(--text-3); margin: 0 0 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .mb-eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--edge); }
    .mb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mb-card {
      position: relative;
      display: flex; gap: 14px; align-items: flex-start;
      padding: 18px;
      border: 1px solid var(--edge); border-radius: 16px; background: var(--bg-card);
      text-decoration: none;
      transition: border-color 0.22s var(--ease-out), transform 0.22s var(--ease-out), box-shadow 0.22s var(--ease-out);
    }
    a.mb-card:hover { border-color: var(--edge-hover); transform: translateY(-3px); box-shadow: var(--glow-hover); }
    a.mb-card:focus-visible { outline: 2px solid var(--blue-300); outline-offset: 3px; }
    .mb-ico {
      flex: none; width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .mb-ico svg { width: 20px; height: 20px; }
    /* 역할별 틴트 — 뉴스레터 지면과 같은 팔레트를 잇는다 */
    .t-blue   { background: rgba(96,165,250,0.13);  color: #93C5FD; }
    .t-purple { background: rgba(167,139,250,0.13); color: #C4B5FD; }
    .t-green  { background: rgba(52,211,153,0.13);  color: #6EE7B7; }
    .t-pink   { background: rgba(244,114,182,0.13); color: #F9A8D4; }
    .t-yellow { background: rgba(251,191,36,0.13);  color: #FCD34D; }
    .t-orange { background: rgba(251,146,60,0.13);  color: #FDBA74; }
    .t-cyan   { background: rgba(34,211,238,0.13);  color: #67E8F9; }
    .mb-card-body { min-width: 0; flex: 1; }
    .mb-card h3 {
      margin: 0 0 5px; font-size: var(--text-body-lg); color: var(--text-1);
      letter-spacing: var(--ls-snug);
      display: flex; align-items: center; gap: 6px;
    }
    .mb-card h3 .arr { opacity: 0; transform: translateX(-4px); transition: opacity 0.2s, transform 0.2s var(--ease-out); color: var(--text-3); }
    a.mb-card:hover h3 .arr { opacity: 1; transform: translateX(0); }
    .mb-card p { margin: 0; font-size: var(--text-body-sm); color: var(--text-2); line-height: var(--lh-normal); }

    /* 입장 모션 — 카드가 순서대로 떠오른다 */
    @keyframes mbRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .mb-hello, .mb-card, .mb-eyebrow { animation: mbRise 0.45s var(--ease-out) both; }

    .mb-gate {
      padding: var(--space-2xl) var(--space-md); text-align: center; color: var(--text-3);
      border: 1px dashed var(--edge); border-radius: 16px; line-height: var(--lh-relaxed);
    }
    .mb-gate a { color: #93C5FD; }
    .mb-net, .mb-admin { margin-top: var(--space-2xl); }

    @media (max-width: 640px) {
      .mb-grid { grid-template-columns: 1fr; }
      .mb-mark { font-size: 110px; bottom: -26px; right: 10px; }
      .cal-cell { min-height: 60px; padding: 4px; }
      .cal-chip small { display: none; }
      .cal-row { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mb-hello, .mb-card, .mb-eyebrow { animation: none; }
      a.mb-card, .mb-card h3 .arr { transition: none; }
      a.mb-card:hover { transform: none; }
    }
  </style>
</head>

  <div class="page-header">
    <div class="page-tag">Members</div>
    <h1 class="page-title">학회원 페이지</h1>
    <p class="page-desc">Y-VENTURES 구성원을 위한 공간입니다.</p>
  </div>

  <section class="section">
    <div class="mb-wrap" id="root">
      <div class="mb-gate">불러오는 중…</div>
    </div>
  </section>

  <dialog class="cal-dialog" id="evDialog">
    <h2 id="evDlgTitle">일정 등록</h2>
    <form id="evForm">
      <div class="cal-row">
        <label><span>분류</span>
          <select name="category">
            <option value="study">Study Session</option>
            <option value="project">Project Session</option>
            <option value="insight">Insight Posting</option>
            <option value="reading">독서</option>
            <option value="event">행사</option>
            <option value="break">휴회</option>
          </select></label>
        <label id="evTypeWrap" hidden><span>행사 종류</span>
          <select name="event_type">
            <option value="vc-career">VC Career Session</option>
            <option value="boost">Boosting Program</option>
            <option value="y-startup">Y-Startup</option>
            <option value="networking">VC&amp;Startup Networking Party</option>
            <option value="__custom">직접 입력…</option>
          </select></label>
      </div>
      <label id="evTypeCustomWrap" hidden><span>행사 이름 (직접 입력)</span>
        <input name="event_type_custom" maxlength="100" placeholder="예: 데모데이, 홈커밍" /></label>
      <label><span>제목</span><input name="title" required maxlength="200" placeholder="예: 3주차 스터디 세션" /></label>
      <div class="cal-row">
        <label><span>날짜</span><input name="starts_on" type="date" required /></label>
        <label><span>시간 (선택)</span><input name="time_text" maxlength="30" placeholder="예: 19:00" /></label>
      </div>
      <label><span>세부 내용 (선택)</span>
        <textarea name="detail" maxlength="1000" placeholder="@를 입력하면 학회원을 태그할 수 있습니다. 예: @홍길동 발제 자료 9/10까지"></textarea></label>
      <div class="cal-sug" id="evSug" hidden></div>
      <p class="fmsg" id="evMsg"></p>
      <div class="btns">
        <button type="button" class="btn btn-outline" id="evCancel">취소</button>
        <button type="submit" class="btn btn-black">저장</button>
      </div>
    </form>
  </dialog>

  <dialog class="cal-dialog" id="evView"><div id="evViewBody"></div></dialog>

  <script>
    (function () {
      var root = document.getElementById("root");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      /* 스트로크 아이콘. 이모지는 플랫폼마다 제각각이라 쓰지 않는다. */
      var I = {
        pen:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        board:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
        folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
        mega:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2-8Z"/></svg>',
        clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
        upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 9 5-5 5 5"/><path d="M12 4v12"/></svg>',

      function card(href, tint, icon, title, desc) {
        /* 외부 문서(구글 시트 등)는 새 탭으로 — 허브를 떠나지 않게 한다 */

          '<span class="mb-ico ' + tint + '">' + I[icon] + '</span>' +

      function helloHtml(p, user) {
        var name = p && p.display_name ? p.display_name

          mark = p.generation != null ? p.generation + "기" : "YV";

          badge = '<span class="mb-badge outside">승인 대기</span>';

      /* 두 구획으로 나눈다.

      function gateHtml(user) {

          '계정은 만들어졌지만 아직 학회원 승인 전입니다.<br />' +

          '프로그램에 지원하셨다면 <a href="/apply/status.html">지원 현황</a>에서 진행 상황을 볼 수 있습니다.' +

      /* 카드가 위에서부터 순서대로 떠오르게 지연을 배분한다 */
      function stagger() {
        var els = root.querySelectorAll(".mb-hello, .mb-eyebrow, .mb-card");
        for (var i = 0; i < els.length; i++) els[i].style.animationDelay = (i * 45) + "ms";
      }

      /* ── 캘린더 ──
         학회 일정이 한 화면에 보인다. 월간은 훑기용, 주간은 세부까지.
         등록은 학회원 누구나 / 수정·삭제는 본인 것만(운영진은 전체).
         운영진이 등록한 일정은 벨 알림으로도 나간다(DB 트리거). */
      var CATS = {
        study:   { label: "Study Session",   chip: "c-study",   badge: "b-study" },
        project: { label: "Project Session", chip: "c-project", badge: "b-project" },
        event:   { label: "행사",            chip: "c-event",   badge: "b-event" },
        insight: { label: "Insight Posting", chip: "c-insight", badge: "b-insight" },
        reading: { label: "독서",            chip: "c-reading", badge: "b-reading" },
        break:   { label: "휴회",            chip: "c-break",   badge: "b-break" }
      };
      var ETYPES = {
        "vc-career":  "VC Career Session",
        "boost":      "Boosting Program",
        "y-startup":  "Y-Startup",
        "networking": "VC&Startup Networking Party"
      };
      var DOW = ["일", "월", "화", "수", "목", "금", "토"];
      /* 대한민국 공휴일 — 법정 공휴일 + 대체공휴일. 연말에 다음 해 추가.
         (2026년부터 제헌절 재지정. 임시공휴일이 생기면 여기 추가) */
      var HOLIDAYS = {
        "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
        "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날",
        "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일", "2026-06-03": "지방선거일",
        "2026-06-06": "현충일", "2026-07-17": "제헌절", "2026-08-15": "광복절", "2026-08-17": "대체공휴일",
        "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
        "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절",
        "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴",
        "2027-02-09": "대체공휴일", "2027-03-01": "삼일절", "2027-05-05": "어린이날",
        "2027-05-13": "부처님오신날", "2027-06-06": "현충일", "2027-07-17": "제헌절", "2027-07-19": "대체공휴일",
        "2027-08-15": "광복절", "2027-08-16": "대체공휴일",
        "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
        "2027-10-03": "개천절", "2027-10-04": "대체공휴일", "2027-10-09": "한글날", "2027-12-25": "성탄절",
        "2027-12-27": "대체공휴일"
      };
      var cal = { db: null, me: null, view: "month", cursor: new Date(), events: [], members: null, editing: null };

      function ymd(d) {
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }

      /* 현재 뷰가 덮는 날짜 범위. 월간은 그리드가 이웃 달로 흘러넘친 칸까지 */
      function calRange() {
        var c = cal.cursor;
        if (cal.view === "week") {
          var s = new Date(c.getFullYear(), c.getMonth(), c.getDate() - c.getDay());
          return [s, new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6)];
        }
        var first = new Date(c.getFullYear(), c.getMonth(), 1);
        var last = new Date(c.getFullYear(), c.getMonth() + 1, 0);
        return [
          new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay()),
          new Date(last.getFullYear(), last.getMonth(), last.getDate() + 6 - last.getDay())
        ];
      }

      async function calLoad() {
        var slot = document.getElementById("calSlot");
        if (!slot) return;
        var rg = calRange(), r;
        try {
          r = await cal.db.from("calendar_events").select("*")
            .gte("starts_on", ymd(rg[0])).lte("starts_on", ymd(rg[1]))
            .order("starts_on").order("time_text");
        } catch (e) { return; }
        /* 테이블이 없으면(마이그레이션 전) 섹션을 조용히 숨긴다 */
        if (!r || r.error) { slot.innerHTML = ""; return; }
        cal.events = r.data || [];
        calRender();
      }

      function evsOn(ds) { return cal.events.filter(function (ev) { return ev.starts_on === ds; }); }

      function typeLabel(ev) {
        /* 행사는 코드 매핑 → 없으면 직접 입력한 이름 그대로 */
        if (ev.category === "event") return ETYPES[ev.event_type] || ev.event_type || "행사";
        return CATS[ev.category].label;
      }

      /* @태그를 하이라이트해서 렌더 (텍스트는 먼저 escape) */
      function detailHtml(ev) {
        var t = esc(ev.detail || "");
        (ev.mentions || []).forEach(function (m) {
          if (m && m.name) {
            t = t.split("@" + esc(m.name)).join('<span class="cal-mention">@' + esc(m.name) + '</span>');
          }
        });
        return t;
      }

      function calRender() {
        var slot = document.getElementById("calSlot");
        var rg = calRange(), c = cal.cursor;
        var label = cal.view === "month"
          ? c.getFullYear() + "년 " + (c.getMonth() + 1) + "월"
          : (rg[0].getMonth() + 1) + "." + rg[0].getDate() + " – " + (rg[1].getMonth() + 1) + "." + rg[1].getDate();

        var head = '<p class="mb-eyebrow">Calendar</p>' +
          '<div class="cal-head"><span class="cal-label">' + esc(label) + '</span>' +
          '<button type="button" class="cal-btn" data-cal="prev" aria-label="이전">‹</button>' +
          '<button type="button" class="cal-btn" data-cal="today">오늘</button>' +
          '<button type="button" class="cal-btn" data-cal="next" aria-label="다음">›</button>' +
          '<button type="button" class="cal-btn' + (cal.view === "week" ? " on" : "") + '" data-cal="week">주간</button>' +
          '<button type="button" class="cal-btn' + (cal.view === "month" ? " on" : "") + '" data-cal="month">월간</button>' +
          '<button type="button" class="cal-btn" data-cal="add">+ 일정 등록</button></div>';

        var body, todayStr = ymd(new Date());
        if (cal.view === "month") {
          var cells = DOW.map(function (d, i) {
            return '<div class="cal-dow' + (i === 0 ? " sun" : "") + '">' + d + '</div>';
          }).join("");
          var d = new Date(rg[0]);
          while (d <= rg[1]) {
            var ds = ymd(d);
            var hol = HOLIDAYS[ds];
            var cls = "cal-cell" + (d.getMonth() !== c.getMonth() ? " out" : "") + (ds === todayStr ? " today" : "");
            var dCls = "d" + (hol || d.getDay() === 0 ? " red" : "");
            var chips = evsOn(ds).map(function (ev) {
              var sub = [ev.time_text, ev.detail].filter(Boolean).join(" · ");
              return '<button type="button" class="cal-chip ' + CATS[ev.category].chip + '" data-ev="' + ev.id + '">' +
                '<b>' + esc(ev.title) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</button>';
            }).join("");
            cells += '<div class="' + cls + '" data-day="' + ds + '" title="일정 등록">' +
              '<div class="' + dCls + '">' + d.getDate() + (hol ? '<span class="hname">' + esc(hol) + '</span>' : '') + '</div>' +
              chips + '</div>';
            d.setDate(d.getDate() + 1);
          }
          body = '<div class="cal-grid">' + cells + '</div>';
        } else {
          var days = "", d2 = new Date(rg[0]);
          while (d2 <= rg[1]) {
            var ds2 = ymd(d2);
            var hol2 = HOLIDAYS[ds2];
            var evs = evsOn(ds2).map(function (ev) {
              return '<div class="cal-ev ' + CATS[ev.category].chip + '" data-ev="' + ev.id + '" role="button" tabindex="0">' +
                '<h5>' + esc(ev.title) + '<small>' + esc(typeLabel(ev)) + (ev.time_text ? " · " + esc(ev.time_text) : "") + '</small></h5>' +
                (ev.detail ? '<p>' + detailHtml(ev) + '</p>' : '') + '</div>';
            }).join("");
            days += '<div class="cal-day' + (ds2 === todayStr ? " today" : "") + (hol2 || d2.getDay() === 0 ? " red" : "") + '" data-day="' + ds2 + '">' +
              '<h4>' + (d2.getMonth() + 1) + "." + d2.getDate() + " (" + DOW[d2.getDay()] + ')' +
              (hol2 ? '<span class="hname">' + esc(hol2) + '</span>' : '') + '</h4>' +
              (evs || '<div class="none">일정 없음</div>') + '</div>';
            d2.setDate(d2.getDate() + 1);
          }
          body = '<div class="cal-week">' + days + '</div>';
        }

        slot.innerHTML = head + body;

        slot.querySelectorAll("[data-cal]").forEach(function (b) {
          b.addEventListener("click", function () {
            var op = b.getAttribute("data-cal"), c2 = cal.cursor;
            if (op === "prev" || op === "next") {
              var step = op === "prev" ? -1 : 1;
              cal.cursor = cal.view === "week"
                ? new Date(c2.getFullYear(), c2.getMonth(), c2.getDate() + step * 7)
                : new Date(c2.getFullYear(), c2.getMonth() + step, 1);
              calLoad();
            } else if (op === "today") { cal.cursor = new Date(); calLoad(); }
            else if (op === "week" || op === "month") { if (cal.view !== op) { cal.view = op; calLoad(); } }
            else if (op === "add") openEvForm(null, null);
          });
        });
        slot.querySelectorAll("[data-ev]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            openEvView(Number(el.getAttribute("data-ev")));
          });
        });
        /* 날짜 칸을 누르면 그 날짜로 바로 등록 */
        slot.querySelectorAll("[data-day]").forEach(function (el) {
          el.addEventListener("click", function () { openEvForm(null, el.getAttribute("data-day")); });
        });
      }

      /* @태그 이메일 알림 — 일정 저장에는 영향 없지만, 실패하면
         등록자에게는 알려준다 (태그한 사람이 못 받았는데 모르면 안 되니까) */
      async function notifyMentions(eventId, ids) {
        try {
          var s = await cal.db.auth.getSession();
          var token = s.data && s.data.session ? s.data.session.access_token : "";
          if (!token) return;
          var r = await fetch("/api/notify-mention", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify({ event_id: eventId, user_ids: ids })
          });
          var j = await r.json().catch(function () { return {}; });
          if (!r.ok) {
            alert("일정은 저장됐지만 @태그 메일은 못 보냈습니다.\n" + (j.error || ("오류 " + r.status)));
          } else if (j.errors && j.errors.length) {
            alert("일정은 저장됐지만 @태그 메일 일부가 실패했습니다.\n" + j.errors.join("\n") +
              "\n\n(도메인 인증 전에는 Resend 가입 이메일로만 발송됩니다)");
          }
        } catch (e) {}
      }

      /* @태그 자동완성용 학회원 이름 — 처음 등록 창을 열 때 한 번만 */
      async function ensureMembers() {
        if (cal.members) return;
        try {
          var r = await cal.db.rpc("list_member_names");
          cal.members = r.error ? [] : (r.data || []);
        } catch (e) { cal.members = []; }
      }

      /* 행사 종류 선택칸 표시 상태 — 분류가 행사일 때만, 직접 입력 칸은
         드롭다운에서 '직접 입력…'을 골랐을 때만 */
      function syncTypeFields() {
        var f = document.getElementById("evForm");
        var isEvent = f.category.value === "event";
        document.getElementById("evTypeWrap").hidden = !isEvent;
        document.getElementById("evTypeCustomWrap").hidden = !(isEvent && f.event_type.value === "__custom");
      }

      function openEvForm(ev, dateStr) {
        cal.editing = ev || null;
        var f = document.getElementById("evForm");
        document.getElementById("evDlgTitle").textContent = ev ? "일정 수정" : "일정 등록";
        f.category.value = ev ? ev.category : "study";
        /* 저장된 행사 종류가 기본 4종이 아니면 직접 입력분이다 */
        var known = ev && ETYPES[ev.event_type];
        f.event_type.value = ev && ev.category === "event"
          ? (known ? ev.event_type : "__custom") : "vc-career";
        f.event_type_custom.value = ev && ev.category === "event" && !known ? (ev.event_type || "") : "";
        f.title.value = ev ? ev.title : "";
        f.starts_on.value = ev ? ev.starts_on : (dateStr || ymd(new Date()));
        f.time_text.value = ev ? ev.time_text : "";
        f.detail.value = ev ? ev.detail : "";
        syncTypeFields();
        document.getElementById("evMsg").textContent = "";
        document.getElementById("evSug").hidden = true;
        ensureMembers();
        document.getElementById("evDialog").showModal();
      }

      function openEvView(id) {
        var ev = null;
        for (var i = 0; i < cal.events.length; i++) if (cal.events[i].id === id) ev = cal.events[i];
        if (!ev) return;
        var mine = cal.me && (ev.author_id === cal.me.id || cal.me.is_admin);
        document.getElementById("evViewBody").innerHTML =
          '<span class="cal-badge ' + CATS[ev.category].badge + '">' + esc(typeLabel(ev)) + '</span>' +
          '<h2>' + esc(ev.title) + '</h2>' +
          '<p class="cal-view-meta">' + esc(String(ev.starts_on).replace(/-/g, ".")) +
          (ev.time_text ? " · " + esc(ev.time_text) : "") +
          (ev.author_name ? " · 등록: " + esc(ev.author_name) : "") + '</p>' +
          (ev.detail ? '<p class="cal-view-detail">' + detailHtml(ev) + '</p>' : '') +
          '<div class="btns" style="margin-top:16px">' +
          (mine ? '<button type="button" class="btn btn-outline" id="evEdit">수정</button>' +
                  '<button type="button" class="btn btn-outline" id="evDel">삭제</button>' : '') +
          '<button type="button" class="btn btn-black" id="evClose">닫기</button></div>';
        var dlg = document.getElementById("evView");
        dlg.showModal();
        document.getElementById("evClose").addEventListener("click", function () { dlg.close(); });
        var ed = document.getElementById("evEdit");
        if (ed) ed.addEventListener("click", function () { dlg.close(); openEvForm(ev, null); });
        var del = document.getElementById("evDel");
        if (del) del.addEventListener("click", function () {
          if (!confirm("이 일정을 삭제할까요?")) return;
          cal.db.from("calendar_events").delete().eq("id", ev.id).then(function (r) {
            if (r.error) { alert("삭제 실패: " + r.error.message); return; }
            dlg.close();
            calLoad();
          });
        });
      }

      /* 등록 폼 배선 — 대화상자는 정적이라 한 번만 */
      function wireEvForm() {
        var f = document.getElementById("evForm");
        var ta = f.detail, box = document.getElementById("evSug");

        f.category.addEventListener("change", syncTypeFields);
        f.event_type.addEventListener("change", syncTypeFields);
        document.getElementById("evCancel").addEventListener("click", function () {
          document.getElementById("evDialog").close();
        });

        /* @ 뒤에 이어 쓰면 학회원 이름을 제안한다 */
        ta.addEventListener("input", function () {
          var m = /@([^\s@]{0,15})$/.exec(ta.value.slice(0, ta.selectionStart));
          if (!m || !cal.members || !cal.members.length) { box.hidden = true; return; }
          var q = m[1];
          var hits = cal.members.filter(function (mm) {
            return mm.display_name && mm.display_name.indexOf(q) === 0;
          }).slice(0, 6);
          if (!hits.length) { box.hidden = true; return; }
          box.innerHTML = hits.map(function (mm) {
            return '<button type="button" data-m="' + esc(mm.display_name) + '">@' + esc(mm.display_name) +
              (mm.generation != null ? ' <span style="color:var(--text-3);font-size:11px">' + mm.generation + '기</span>' : '') +
              '</button>';
          }).join("");
          box.hidden = false;
          box.querySelectorAll("[data-m]").forEach(function (b) {
            b.addEventListener("click", function () {
              var pos = ta.selectionStart;
              var before = ta.value.slice(0, pos).replace(/@[^\s@]{0,15}$/, "@" + b.getAttribute("data-m") + " ");
              ta.value = before + ta.value.slice(pos);
              box.hidden = true;
              ta.focus();
              ta.selectionStart = ta.selectionEnd = before.length;
            });
          });
        });

        f.addEventListener("submit", function (e) {
          e.preventDefault();
          var fm = document.getElementById("evMsg");
          var detail = ta.value.trim();
          /* 제출 시점에 본문을 스캔해 실제로 남아 있는 @태그만 저장한다 */
          var mentions = (cal.members || []).filter(function (m) {
            return m.display_name && detail.indexOf("@" + m.display_name) >= 0;
          }).map(function (m) { return { id: m.id, name: m.display_name }; });

          var etype = "";
          if (f.category.value === "event") {
            etype = f.event_type.value === "__custom" ? f.event_type_custom.value.trim() : f.event_type.value;
            if (!etype) { fm.textContent = "행사 이름을 입력해주세요."; fm.className = "fmsg err"; return; }
          }
          var row = {
            category: f.category.value,
            event_type: etype,
            title: f.title.value.trim(),
            starts_on: f.starts_on.value,
            time_text: f.time_text.value.trim(),
            detail: detail,
            mentions: mentions
          };
          /* 이번에 새로 태그된 사람에게만 이메일 알림을 보낸다.
             본인 태그도 보낸다 — 스스로에게 리마인더 + 발송 테스트 경로 */
          var prevIds = cal.editing ? (cal.editing.mentions || []).map(function (m) { return m.id; }) : [];
          var newIds = mentions.map(function (m) { return m.id; })
            .filter(function (id) { return prevIds.indexOf(id) < 0; });

          fm.textContent = "저장 중…"; fm.className = "fmsg";
          var q;
          if (cal.editing) q = cal.db.from("calendar_events").update(row).eq("id", cal.editing.id).select().single();
          else {
            row.author_id = cal.me.id;
            row.author_name = cal.me.name || "";
            q = cal.db.from("calendar_events").insert(row).select().single();
          }
          q.then(function (r) {
            if (r.error) {
              fm.textContent = "실패: " + r.error.message +
                (String(r.error.code) === "PGRST205" ? " — migration-calendar.sql 을 실행했는지 확인하세요." : "");
              fm.className = "fmsg err";
              return;
            }
            if (r.data && newIds.length) notifyMentions(r.data.id, newIds);
            document.getElementById("evDialog").close();
            calLoad();
          });
        });
      }

      window.addEventListener("DOMContentLoaded", async function () {
        if (!window.yvAuth) return;
        var user = await yvAuth.requireAuth();
        if (!user) return;

        var db = yvAuth.client;
        var p = null;
        try {
          var r = await db.from("profiles")
            .select("display_name, generation, is_member, is_alumni, is_admin").eq("id", user.id).maybeSingle();
          p = r.data;
        } catch (e) {}

        var html = helloHtml(p, user);
        if (p && (p.is_member || p.is_admin)) {
          html += '<div class="mb-cal" id="calSlot"></div>';
          html += memberCards();
          if (p.is_admin) html += adminCards();
        } else {
          html += gateHtml(user);
        }
        root.innerHTML = html;
        stagger();
        if (p && (p.is_member || p.is_admin)) {
          cal.db = db;
          cal.me = { id: user.id, is_admin: !!p.is_admin, name: p.display_name || "" };
          wireEvForm();
          calLoad();

          /* 따라다니는 체크리스트 — 이번 주 할 일. 항목은 js/members-checklist.js */
          if (window.yvChecklist) yvChecklist.init({ userId: user.id, db: db });

          /* 첫 방문 가이드 — 카드가 다 떠오른 뒤에 연다(스태거 ~0.7s).
             한 번 보면 다시 안 뜨고, 인사 카드 링크로 언제든 다시 볼 수 있다 */
          if (window.yvGuide) {
            var guideBtn = document.getElementById("guideBtn");
            if (guideBtn) guideBtn.addEventListener("click", function () {
              yvGuide.start({ userId: user.id, force: true });
            });
            if (!yvGuide.seen(user.id)) setTimeout(function () { yvGuide.start({ userId: user.id }); }, 900);
          }
        }

        document.getElementById("logoutBtn").addEventListener("click", async function () {
          await yvAuth.signOut();
          window.location.href = "/index.html";
        });
      });
    })();
  </script>
  <script>
    (function () {
      var hb = document.getElementById("hamburger");
      var nm = document.getElementById("navMenu");
      if (hb && nm) hb.addEventListener("click", function () { nm.classList.toggle("open"); });
    })();
  </script>
