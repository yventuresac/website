<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <title>통계 — Y-VENTURES 관리</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/style.css?v=20260812d" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-guard.js"></script>
  <style>
    .stat-wrap { max-width: 780px; margin: 0 auto; }
    .stat-total {
      display: flex; align-items: baseline; gap: 12px;
      padding: var(--space-lg); margin-bottom: var(--space-md);
      border: 1px solid var(--edge); border-radius: 16px; background: var(--bg-card);
    }
    .stat-total b { font-size: 44px; letter-spacing: var(--ls-tight); color: var(--text-1); line-height: 1; }
    .stat-total span { font-size: var(--text-body-sm); color: var(--text-3); }
    .stat-table { width: 100%; border-collapse: collapse; font-size: var(--text-body-sm); }
    .stat-table th, .stat-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--edge); }
    .stat-table th { font-size: var(--text-eyebrow); letter-spacing: var(--ls-wide); text-transform: uppercase; color: var(--text-3); font-weight: var(--fw-medium); }
    .stat-table td { color: var(--text-2); }
    .stat-table td:first-child { color: var(--text-1); font-weight: var(--fw-medium); }
    .stat-table td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-1); font-weight: var(--fw-semibold); }
    .stat-msg { padding: var(--space-2xl) var(--space-md); text-align: center; color: var(--text-3);
                border: 1px dashed var(--edge); border-radius: 12px; }
  </style>
</head>
<body class="theme-mono">

  <nav id="nav" class="scrolled">
    <a href="/index.html" class="nav-logo" aria-label="Y-VENTURES 홈">
      <img src="../assets/logo.png" alt="Y-VENTURES" />
    </a>
  </nav>

  <div class="page-header">
    <div class="page-tag">Admin</div>
    <h1 class="page-title">통계</h1>
    <p class="page-desc">관리자만 볼 수 있습니다. 지원서 양식 다운로드 클릭 수를 집계합니다.</p>
  </div>

  <section class="section">
    <div class="stat-wrap" id="wrap">
      <div class="stat-msg" id="msg">불러오는 중…</div>
    </div>
  </section>

  <script>
    (function () {
      var wrap = document.getElementById("wrap");
      var msg = document.getElementById("msg");

      function show(html) { wrap.innerHTML = html; }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function fmtDate(s) {
        var d = new Date(s);
        if (isNaN(d)) return "";
        var p = function (n) { return String(n).padStart(2, "0"); };
        return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
      }

      window.addEventListener("DOMContentLoaded", function () {
        if (!window.yvAuth) { msg.textContent = "설정이 완료되지 않았습니다."; return; }
        var db = window.yvAuth.client;

        /* RLS 로 값이 막히면 '권한 없음'과 '데이터 없음'이 똑같이 빈 배열로 온다.
           둘을 구분해 주지 않으면 무엇을 고쳐야 할지 알 수 없으므로 권한을 먼저 본다. */
        db.auth.getUser().then(function (u) {
          var user = u && u.data ? u.data.user : null;
          if (!user) { msg.textContent = "로그인이 필요합니다."; return; }
          return db.from("profiles").select("is_admin, display_name").eq("id", user.id).maybeSingle()
            .then(function (pr) {
              var isAdmin = pr && pr.data && pr.data.is_admin;
              if (!isAdmin) {
                show('<div class="stat-msg">이 계정에는 관리자 권한이 없습니다.<br />' +
                     '지금 로그인한 계정: ' + esc(user.email || "") + '</div>');
                return;
              }
              return loadCounts(db);
            });
        });
      });

      function loadCounts(db) {
        var wrap = document.getElementById("wrap");
        var msg = document.getElementById("msg");
        return db.from("download_counts")
          .select("slug, label, count, updated_at")
          .order("count", { ascending: false })
          .then(function (r) {
            if (r.error) { wrap.textContent = "불러오지 못했습니다: " + r.error.message; return; }
            var rows = (r.data || []).filter(function (x) { return x.slug.indexOf("__") !== 0; });

            if (!rows.length) {
              /* RLS 로 관리자만 조회된다. 값이 비면 아직 클릭이 없거나 관리자가 아니다. */
              show('<div class="stat-msg">관리자로 확인되었습니다.<br />아직 집계된 클릭이 없습니다.</div>');
              return;
            }

            var total = rows.reduce(function (a, x) { return a + Number(x.count || 0); }, 0);
            var last = rows.map(function (x) { return x.updated_at; }).sort().pop();

            var html =
              '<div class="stat-total"><b>' + total + '</b>' +
              '<span>번 눌렸습니다' + (last ? ' · 마지막 ' + esc(fmtDate(last)) : '') + '</span></div>' +
              '<table class="stat-table"><thead><tr>' +
              '<th>항목</th><th>위치</th><th style="text-align:right">클릭</th><th>최근</th>' +
              '</tr></thead><tbody>' +
              rows.map(function (x) {
                return '<tr><td>' + esc(x.slug) + '</td><td>' + esc(x.label || "-") + '</td>' +
                       '<td class="num">' + Number(x.count || 0) + '</td>' +
                       '<td>' + esc(fmtDate(x.updated_at)) + '</td></tr>';
              }).join("") +
              '</tbody></table>';
            show(html);
          }, function (e) {
            wrap.textContent = "불러오지 못했습니다: " + e;
          });
      }
    })();
  </script>
</body>
</html>
