<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <title>회원가입 — Y-VENTURES</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <nav id="nav" class="scrolled">
    <a href="../index.html" class="nav-logo" aria-label="Y-VENTURES 홈">
      <img src="../assets/logo.png" alt="Y-VENTURES" />
    </a>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="eyebrow">Create Account</div>
      <h1 class="auth-title">회원가입</h1>
      <p class="auth-sub">이메일과 비밀번호로 계정을 만드세요.</p>

      <form id="signupForm" class="auth-form" novalidate>
        <label class="auth-field">
          <span>이름</span>
          <input type="text" name="name" autocomplete="name" required placeholder="홍길동" />
        </label>
        <label class="auth-field">
          <span>이메일</span>
          <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label class="auth-field">
          <span>비밀번호 <em>(6자 이상)</em></span>
          <input type="password" name="password" autocomplete="new-password" required minlength="6" placeholder="••••••••" />
        </label>
        <label class="auth-field">
          <span>비밀번호 확인</span>
          <input type="password" name="password2" autocomplete="new-password" required minlength="6" placeholder="••••••••" />
        </label>

        <div class="auth-msg" id="authMsg" role="alert"></div>

        <button type="submit" class="btn btn-black auth-submit" id="submitBtn">회원가입</button>
      </form>

      <p class="auth-alt">이미 계정이 있으신가요? <a href="./login.html">로그인</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('signupForm');
      var msg = document.getElementById('authMsg');
      var btn = document.getElementById('submitBtn');

      if (window.yvAuth) yvAuth.redirectIfAuthed();

      function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = 'auth-msg ' + (ok ? 'is-ok' : 'is-error');
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!window.yvAuth) { showMsg('설정이 완료되지 않았습니다. 관리자에게 문의하세요.', false); return; }
        var name = form.name.value.trim();
        var email = form.email.value.trim();
        var password = form.password.value;
        var password2 = form.password2.value;

        if (!name || !email || !password) { showMsg('모든 항목을 입력하세요.', false); return; }
        if (password.length < 6) { showMsg('비밀번호는 6자 이상이어야 합니다.', false); return; }
        if (password !== password2) { showMsg('비밀번호가 일치하지 않습니다.', false); return; }

        btn.disabled = true; btn.textContent = '가입 중…'; showMsg('', true);
        var res = await yvAuth.signUp(email, password, name);
        if (res.error) {
          showMsg('가입 실패: ' + res.error.message, false);
          btn.disabled = false; btn.textContent = '회원가입';
          return;
        }

        // 이메일 확인이 켜져 있으면 session 이 없고 확인 메일이 발송됨
        var hasSession = res.data && res.data.session;
        if (hasSession) {
          var params = new URLSearchParams(window.location.search);
          window.location.replace(yvAuth.safeNext(params.get('next')));
        } else {
          form.style.display = 'none';
          showMsg('가입 완료! 입력하신 이메일로 보낸 확인 링크를 클릭한 뒤 로그인하세요.', true);
        }
      });
    })();
  </script>
</body>
</html>
