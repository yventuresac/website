<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <title>회원가입 — Y-VENTURES</title>
  <link rel="stylesheet" href="../css/style.css?v=20260820" />
  <style>
    /* 가입 직후 — 메일함 확인 안내. 폼 자리를 통째로 대신한다 */
    .auth-done-ico {
      width: 52px; height: 52px; border-radius: 14px; margin-top: 4px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(96, 165, 250, 0.14); color: #93C5FD;
    }
    .auth-done-ico svg { width: 24px; height: 24px; }
    .auth-done h2 { margin: 20px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-1); }
    .auth-done p { margin: 12px 0 0; font-size: 14px; line-height: 1.7; color: var(--text-3); }
    .auth-done p b { color: var(--text-1); font-weight: 600; white-space: nowrap; }
    .auth-done #doneEmail { white-space: normal; word-break: break-all; }
    .auth-done-hint { font-size: 13px; }
    .auth-done-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
    .auth-done-actions .btn { flex: 1; min-width: 150px; text-align: center; cursor: pointer; white-space: nowrap; }
    .auth-done-actions .btn:disabled { opacity: 0.55; cursor: default; transform: none; }
    .auth-done .auth-msg { margin-top: 12px; }
  </style>
</head>
<body>

  <nav id="nav" class="scrolled">
    <a href="../index.html" class="nav-logo" aria-label="Y-VENTURES 홈">
      <img src="../assets/logo.png" alt="Y-VENTURES" />
    </a>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="eyebrow">Create Account</div>
      <h1 class="auth-title">회원가입</h1>
      <p class="auth-sub">이메일과 비밀번호로 계정을 만드세요.</p>

      <form id="signupForm" class="auth-form" novalidate>
        <label class="auth-field">
          <span>이름</span>
          <input type="text" name="name" autocomplete="name" required placeholder="홍길동" />
        </label>
        <label class="auth-field">
          <span>이메일</span>
          <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label class="auth-field">
          <span>비밀번호 <em>(6자 이상)</em></span>
          <input type="password" name="password" autocomplete="new-password" required minlength="6" placeholder="••••••••" />
        </label>
        <label class="auth-field">
          <span>비밀번호 확인</span>
          <input type="password" name="password2" autocomplete="new-password" required minlength="6" placeholder="••••••••" />
        </label>
        <label class="auth-field">
          <span>Y-VENTURES 기수 <em>(해당하는 경우만)</em></span>
          <select name="generation">
            <option value="">해당 없음 · 외부 방문자</option>
            <option value="0">0기 · 창립 멤버</option>
            <option value="1">1기</option>
            <option value="2">2기</option>
            <option value="3">3기</option>
            <option value="4">4기</option>
          </select>
        </label>
        <p class="auth-note">기수를 선택해도 학회원 권한은 운영진 확인 후에 열립니다.</p>

        <div class="auth-msg" id="authMsg" role="alert"></div>

        <button type="submit" class="btn btn-black auth-submit" id="submitBtn">회원가입</button>
      </form>

      <div class="auth-done" id="signupDone" hidden>
        <div class="auth-done-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </div>
        <h2>메일함을 확인해 주세요</h2>
        <p><b id="doneEmail"></b>로 확인 메일을 보냈습니다.<br />메일 안의 링크를 누르면 가입이 끝나고, 그 뒤에 로그인할 수 있습니다.</p>
        <p class="auth-done-hint">몇 분 안에 안 오면 스팸함을 확인해 주세요. 발신자는 <b>notify@yventures.ac</b>입니다.</p>
        <div class="auth-done-actions">
          <button type="button" class="btn btn-outline" id="resendBtn">메일 다시 보내기</button>
          <a class="btn btn-black" href="./login.html">로그인으로</a>
        </div>
        <div class="auth-msg" id="doneMsg" role="status"></div>
      </div>

      <p class="auth-alt" id="authAlt">이미 계정이 있으신가요? <a href="./login.html">로그인</a></p>
      <p class="auth-privacy">
        가입하시면 <a href="../privacy/">개인정보 처리방침</a>에 동의하는 것으로 봅니다.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth-config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('signupForm');
      var msg = document.getElementById('authMsg');
      var btn = document.getElementById('submitBtn');

      if (window.yvAuth) yvAuth.redirectIfAuthed();

      function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = 'auth-msg ' + (ok ? 'is-ok' : 'is-error');
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!window.yvAuth) { showMsg('설정이 완료되지 않았습니다. 관리자에게 문의하세요.', false); return; }
        var name = form.name.value.trim();
        var email = form.email.value.trim();
        var password = form.password.value;
        var password2 = form.password2.value;

        if (!name || !email || !password) { showMsg('모든 항목을 입력하세요.', false); return; }
        if (password.length < 6) { showMsg('비밀번호는 6자 이상이어야 합니다.', false); return; }
        if (password !== password2) { showMsg('비밀번호가 일치하지 않습니다.', false); return; }

        btn.disabled = true; btn.textContent = '가입 중…'; showMsg('', true);
        var gen = form.generation ? form.generation.value : "";
        var res = await yvAuth.signUp(email, password, name, gen ? { generation: gen } : null);
        if (res.error) {
          showMsg('가입 실패: ' + res.error.message, false);
          btn.disabled = false; btn.textContent = '회원가입';
          return;
        }

        // 이메일 확인이 켜져 있으면 session 이 없고 확인 메일이 발송됨
        var hasSession = res.data && res.data.session;
        if (hasSession) {
          var params = new URLSearchParams(window.location.search);
          window.location.replace(yvAuth.safeNext(params.get('next')));
        } else {
          showDone(email);
        }
      });

      /* 확인 메일을 보냈다는 것을 분명히 보여준다.
         예전엔 폼 안의 한 줄 문구였는데 폼을 숨기면서 같이 사라졌다. */
      function showDone(email) {
        /* hidden 속성은 display 를 명시한 요소(.auth-form 은 flex)에는 안 먹는다 */
        ['#signupForm', '.eyebrow', '.auth-title', '.auth-sub', '#authAlt'].forEach(function (sel) {
          var el = document.querySelector(sel);
          if (el) el.style.display = 'none';
        });
        document.getElementById('doneEmail').textContent = email;
        document.getElementById('signupDone').hidden = false;
        window.scrollTo({ top: 0 });

        /* 다시 보내기 — Supabase 는 같은 주소로 60초에 한 통이라 그만큼 잠근다 */
        var resend = document.getElementById('resendBtn');
        var doneMsg = document.getElementById('doneMsg');
        var left = 0, timer = null;
        function tick() {
          if (left <= 0) { clearInterval(timer); resend.disabled = false; resend.textContent = '메일 다시 보내기'; return; }
          resend.disabled = true; resend.textContent = '다시 보내기 · ' + left + '초'; left--;
        }
        function lock() { left = 60; tick(); timer = setInterval(tick, 1000); }
        lock();
        resend.addEventListener('click', async function () {
          if (resend.disabled) return;
          resend.disabled = true; resend.textContent = '보내는 중…';
          var r = await yvAuth.client.auth.resend({ type: 'signup', email: email });
          if (r.error) {
            doneMsg.textContent = '다시 보내지 못했습니다: ' + r.error.message;
            doneMsg.className = 'auth-msg is-error';
            resend.disabled = false; resend.textContent = '메일 다시 보내기';
            return;
          }
          doneMsg.textContent = '확인 메일을 다시 보냈습니다.';
          doneMsg.className = 'auth-msg is-ok';
          lock();
        });
      }
    })();
  </script>
  <script src="/js/to-top.js" defer></script>
  <!-- 방문 통계 (Vercel Web Analytics · 쿠키 없음) -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
